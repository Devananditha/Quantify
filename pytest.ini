[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    unit: Pure unit tests — no DB, no HTTP
    integration: Tests that hit a real PostgreSQL database
    concurrency: Tests for race-condition / locking behaviour
